services:
  postgres:
    image: postgres:16-alpine
    container_name: game-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-game_db}
      POSTGRES_USER: ${POSTGRES_USER:-game_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - game_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game_user} -d ${POSTGRES_DB:-game_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  game_db_data:
